<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>mermaid</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;         /* the native node owns the size; never scroll */
  }
  * {
    box-sizing: border-box;
  }
  #root {
    width: 100%;
    display: flow-root;
    padding: 2px 0;
  }
  /* The rendered svg is sized inline from JS as well; the rule is the
     fallback for the pre-render state. */
  #root svg {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* -------------------------------------------------------------------------
 * Offline Mermaid render harness (no network, no innerHTML of payload).
 *
 * Contract with ArkTS:
 *   window.__onRender(heightCssPx:int, ok:boolean, errText:string)  <- ArkTS
 *   window.render(payloadJson:string)                               -> page
 *
 * payload = { code, dark, fontPx, bg, textColor, accent, fontFamily? }
 *   fontFamily is optional; when omitted Mermaid's own default stack is used.
 * ---------------------------------------------------------------------- */
(function () {
  'use strict';

  var RETRY_MS = 100;
  var RETRY_MAX = 50;              /* ~5 s for a bridge that attaches late */
  var RENDER_TIMEOUT_MS = 15000;

  var pendingPayload = null;
  var libReady = false;
  var hasRendered = false;
  var lastSig = '';
  var watchdog = 0;
  var seq = 0;

  /* --- bridge delivery -------------------------------------------------- */

  function deliver(h, ok, err) {
    try {
      if (typeof window.__onRender === 'function') {
        window.__onRender(h, ok, err || '');
        return true;
      }
    } catch (e) {
      /* the bridge threw: treat it as undelivered and retry */
    }
    return false;
  }

  function deliverWithRetry(h, ok, err) {
    var tries = 0;
    function attempt() {
      if (deliver(h, ok, err)) {
        return;
      }
      tries += 1;
      if (tries < RETRY_MAX) {
        setTimeout(attempt, RETRY_MS);
      }
    }
    attempt();
  }

  function report(h, ok, err) {
    var height = ok ? Math.max(0, Math.round(h || 0)) : 0;
    var text = err ? String(err) : '';
    if (watchdog) {
      clearTimeout(watchdog);
      watchdog = 0;
    }
    lastSig = height + '|' + (ok ? '1' : '0');
    deliverWithRetry(height, !!ok, text);
  }

  function armWatchdog() {
    if (watchdog) {
      clearTimeout(watchdog);
    }
    watchdog = setTimeout(function () {
      watchdog = 0;
      report(0, false, 'render timed out after ' + RENDER_TIMEOUT_MS + ' ms');
    }, RENDER_TIMEOUT_MS);
  }

  /* --- measurement ----------------------------------------------------- */

  function measure() {
    try {
      var root = document.getElementById('root');
      if (root) {
        var rect = root.getBoundingClientRect();
        var h = Math.max(rect.height || 0, root.scrollHeight || 0);
        return (isFinite(h) && h > 0) ? Math.ceil(h) : 0;
      }
      return Math.ceil(document.documentElement.scrollHeight || 0);
    } catch (e) {
      return 0;
    }
  }

  function reportFromResize() {
    if (!hasRendered) {
      return;
    }
    var h = measure();
    if ((h + '|1') === lastSig) {
      return;
    }
    report(h, true, '');
  }

  function watchResize() {
    try {
      if (typeof ResizeObserver !== 'function') {
        return;
      }
      var root = document.getElementById('root');
      if (!root) {
        return;
      }
      var scheduled = 0;
      var ro = new ResizeObserver(function () {
        if (scheduled) {
          return;
        }
        scheduled = window.requestAnimationFrame(function () {
          scheduled = 0;
          reportFromResize();
        });
      });
      ro.observe(root);
    } catch (e) {
      /* reporting still works without a resize observer */
    }
  }

  /* --- payload --------------------------------------------------------- */

  function parsePayload(json) {
    if (typeof json === 'string') {
      if (json.length === 0) {
        throw new Error('empty payload');
      }
      return JSON.parse(json);
    }
    if (json && typeof json === 'object') {
      return json;
    }
    throw new Error('payload is not a JSON string');
  }

  function cssColor(v, fallback) {
    if (typeof v === 'string') {
      if (v === 'transparent' || /^#[0-9a-fA-F]{3,8}$/.test(v)) {
        return v;
      }
    }
    return fallback;
  }

  function themeOf(p) {
    var dark = p.dark === true;
    var fontPx = (typeof p.fontPx === 'number' && isFinite(p.fontPx) && p.fontPx > 0)
      ? p.fontPx : 17;
    return {
      dark: dark,
      fontPx: fontPx,
      bg: cssColor(p.bg, dark ? '#1C1C1E' : '#FFFFFF'),
      textColor: cssColor(p.textColor, dark ? '#E6E6E6' : '#1A1A1A'),
      accent: cssColor(p.accent, dark ? '#6EA8FF' : '#0A59F7')
    };
  }

  /* Insert Mermaid's own svg output. The payload is never treated as HTML;
     this is the library's generated (securityLevel: 'strict') document. */
  function insertMarkup(container, markup) {
    container.textContent = '';
    try {
      var range = document.createRange();
      range.selectNodeContents(container);
      container.appendChild(range.createContextualFragment(markup));
      return;
    } catch (e) {
      /* older engines: fall back to a detached template */
    }
    var tpl = document.createElement('template');
    tpl.innerHTML = markup;
    container.appendChild(tpl.content);
  }

  function normaliseSvg(root) {
    var svg = root.querySelector('svg');
    if (!svg) {
      return null;
    }
    /* Mermaid writes an inline max-width of the intrinsic size, which a
       stylesheet rule cannot beat; set it inline from here instead. */
    svg.style.maxWidth = '100%';
    svg.style.height = 'auto';
    svg.style.display = 'block';
    svg.style.margin = '0 auto';
    return svg;
  }

  /* --- render ---------------------------------------------------------- */

  async function renderPayload(json) {
    var p, t, root, vars, id, out, svg;

    try {
      p = parsePayload(json);
    } catch (e) {
      report(0, false, 'payload: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    t = themeOf(p);

    if (typeof p.code !== 'string') {
      report(0, false, 'payload: "code" must be a string');
      return;
    }
    if (!window.mermaid || typeof window.mermaid.render !== 'function') {
      report(0, false, 'mermaid is not available (vendor/mermaid.min.js)');
      return;
    }

    root = document.getElementById('root');
    if (!root) {
      report(0, false, 'no #root element');
      return;
    }

    vars = {
      fontSize: t.fontPx + 'px',
      primaryColor: t.accent
    };
    if (typeof p.fontFamily === 'string' && p.fontFamily.length > 0) {
      vars.fontFamily = p.fontFamily;
    }

    try {
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: t.dark ? 'dark' : 'default',
        themeVariables: vars
      });
    } catch (e) {
      report(0, false, 'mermaid.initialize: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    seq += 1;
    id = 'gm' + seq + '_' + Date.now();

    try {
      out = await window.mermaid.render(id, p.code);
    } catch (e) {
      report(0, false, 'mermaid: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    /* Mermaid leaves its measuring container behind in some versions. */
    try {
      var stray = document.getElementById('d' + id);
      if (stray && stray.parentNode) {
        stray.parentNode.removeChild(stray);
      }
    } catch (e) {
      /* harmless */
    }

    if (!out || typeof out.svg !== 'string' || out.svg.indexOf('<svg') < 0) {
      report(0, false, 'mermaid: empty output');
      return;
    }

    insertMarkup(root, out.svg);
    svg = normaliseSvg(root);
    if (!svg) {
      report(0, false, 'mermaid: output contains no <svg>');
      return;
    }

    if (typeof out.bindFunctions === 'function') {
      try {
        out.bindFunctions(root);
      } catch (e) {
        /* interactivity is optional; the diagram is already drawn */
      }
    }

    hasRendered = true;
    report(measure(), true, '');
  }

  /* --- entry points ---------------------------------------------------- */

  /* renderPayload is async; never leave a rejection unhandled or the page
     goes silent and the native block stays at zero height. */
  function runPayload(json) {
    var pr = renderPayload(json);
    if (pr && typeof pr.catch === 'function') {
      pr.catch(function (e) {
        report(0, false, 'render: ' + (e && e.message ? e.message : String(e)));
      });
    }
  }

  window.render = function (json) {
    pendingPayload = json;
    armWatchdog();
    if (!libReady) {
      return;                  /* replayed by window.__libReady() */
    }
    runPayload(pendingPayload);
  };

  window.__libReady = function () {
    libReady = true;
    if (pendingPayload !== null) {
      runPayload(pendingPayload);
    }
  };

  window.__libFail = function (what) {
    libReady = true;
    report(0, false, String(what) + ' failed to load');
  };

  watchResize();
})();
</script>
<script src="vendor/mermaid.min.js"
        onload="window.__libReady()"
        onerror="window.__libFail('vendor/mermaid.min.js')"></script>
</body>
</html>
