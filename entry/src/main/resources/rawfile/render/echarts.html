<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>echarts</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;         /* the native node owns the size; never scroll */
  }
  * {
    box-sizing: border-box;
  }
  /* ECharts needs a concrete box to lay out into; the height is set inline
     from payload.height before init(). */
  #root {
    width: 100%;
    height: 320px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* -------------------------------------------------------------------------
 * Offline ECharts render harness (no network, no innerHTML of payload).
 *
 * Contract with ArkTS:
 *   window.__onRender(heightCssPx:int, ok:boolean, errText:string)  <- ArkTS
 *   window.render(payloadJson:string)                               -> page
 *
 * payload = { code, dark, fontPx, bg, textColor, accent, height? }
 *   code   : the ECharts option as a JSON string
 *   height : optional chart height in CSS px (default 320)
 *   bg     : pass "transparent" to let the native material show through
 * ---------------------------------------------------------------------- */
(function () {
  'use strict';

  var DEFAULT_HEIGHT = 320;
  var RETRY_MS = 100;
  var RETRY_MAX = 50;              /* ~5 s for a bridge that attaches late */
  var RENDER_TIMEOUT_MS = 15000;

  var pendingPayload = null;
  var libReady = false;
  var hasRendered = false;
  var lastSig = '';
  var watchdog = 0;
  var chart = null;

  /* --- bridge delivery -------------------------------------------------- */

  function deliver(h, ok, err) {
    try {
      if (typeof window.__onRender === 'function') {
        window.__onRender(h, ok, err || '');
        return true;
      }
    } catch (e) {
      /* the bridge threw: treat it as undelivered and retry */
    }
    return false;
  }

  function deliverWithRetry(h, ok, err) {
    var tries = 0;
    function attempt() {
      if (deliver(h, ok, err)) {
        return;
      }
      tries += 1;
      if (tries < RETRY_MAX) {
        setTimeout(attempt, RETRY_MS);
      }
    }
    attempt();
  }

  function report(h, ok, err) {
    var height = ok ? Math.max(0, Math.round(h || 0)) : 0;
    var text = err ? String(err) : '';
    if (watchdog) {
      clearTimeout(watchdog);
      watchdog = 0;
    }
    lastSig = height + '|' + (ok ? '1' : '0');
    deliverWithRetry(height, !!ok, text);
  }

  function armWatchdog() {
    if (watchdog) {
      clearTimeout(watchdog);
    }
    watchdog = setTimeout(function () {
      watchdog = 0;
      report(0, false, 'render timed out after ' + RENDER_TIMEOUT_MS + ' ms');
    }, RENDER_TIMEOUT_MS);
  }

  /* --- measurement ----------------------------------------------------- */

  function measure() {
    try {
      var root = document.getElementById('root');
      if (root) {
        var rect = root.getBoundingClientRect();
        var h = Math.max(rect.height || 0, root.scrollHeight || 0);
        return (isFinite(h) && h > 0) ? Math.ceil(h) : 0;
      }
      return Math.ceil(document.documentElement.scrollHeight || 0);
    } catch (e) {
      return 0;
    }
  }

  function reportFromResize() {
    if (!hasRendered) {
      return;
    }
    var h = measure();
    if ((h + '|1') === lastSig) {
      return;
    }
    report(h, true, '');
  }

  function watchResize(onChange) {
    try {
      if (typeof ResizeObserver !== 'function') {
        return;
      }
      var root = document.getElementById('root');
      if (!root) {
        return;
      }
      var scheduled = 0;
      var ro = new ResizeObserver(function () {
        if (scheduled) {
          return;
        }
        scheduled = window.requestAnimationFrame(function () {
          scheduled = 0;
          onChange();
        });
      });
      ro.observe(root);
    } catch (e) {
      /* reporting still works without a resize observer */
    }
  }

  /* --- payload --------------------------------------------------------- */

  function parsePayload(json) {
    if (typeof json === 'string') {
      if (json.length === 0) {
        throw new Error('empty payload');
      }
      return JSON.parse(json);
    }
    if (json && typeof json === 'object') {
      return json;
    }
    throw new Error('payload is not a JSON string');
  }

  function cssColor(v, fallback) {
    if (typeof v === 'string') {
      if (v === 'transparent' || /^#[0-9a-fA-F]{3,8}$/.test(v)) {
        return v;
      }
    }
    return fallback;
  }

  function themeOf(p) {
    var dark = p.dark === true;
    var fontPx = (typeof p.fontPx === 'number' && isFinite(p.fontPx) && p.fontPx > 0)
      ? p.fontPx : 17;
    return {
      dark: dark,
      fontPx: fontPx,
      bg: cssColor(p.bg, ''),
      textColor: cssColor(p.textColor, dark ? '#E6E6E6' : '#1A1A1A'),
      accent: cssColor(p.accent, dark ? '#6EA8FF' : '#0A59F7')
    };
  }

  /* Theme defaults are merged in only where the author left the key unset, so
     a hand-styled option is never repainted. */
  function applyTheme(opt, t) {
    /* Sub-option fields are spelled out as single assignments on purpose:
       ArkTS-free plain JS, but keep it readable and avoid Object.assign on
       deeply nested author objects. */
    if (!opt.backgroundColor) {
      opt.backgroundColor = t.bg || 'transparent';
    }
    if (opt.textStyle === undefined || opt.textStyle === null) {
      opt.textStyle = { color: t.textColor };
    } else if (typeof opt.textStyle === 'object' && opt.textStyle.color === undefined) {
      opt.textStyle.color = t.textColor;
    }
    if (opt.color === undefined) {
      opt.color = [t.accent];
    }
  }

  /* --- render ---------------------------------------------------------- */

  function renderPayload(json) {
    var p, t, root, opt, h;

    try {
      p = parsePayload(json);
    } catch (e) {
      report(0, false, 'payload: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    t = themeOf(p);

    if (typeof p.code !== 'string') {
      report(0, false, 'payload: "code" must be a string');
      return;
    }
    if (!window.echarts || typeof window.echarts.init !== 'function') {
      report(0, false, 'echarts is not available (vendor/echarts.min.js)');
      return;
    }

    try {
      opt = JSON.parse(p.code);
    } catch (e) {
      report(0, false, 'option JSON: ' + (e && e.message ? e.message : String(e)));
      return;
    }
    if (!opt || typeof opt !== 'object' || Object.prototype.toString.call(opt) === '[object Array]') {
      report(0, false, 'option must be a JSON object');
      return;
    }

    root = document.getElementById('root');
    if (!root) {
      report(0, false, 'no #root element');
      return;
    }

    h = (typeof p.height === 'number' && isFinite(p.height) && p.height > 0)
      ? Math.round(p.height) : DEFAULT_HEIGHT;
    root.style.height = h + 'px';

    applyTheme(opt, t);

    try {
      if (chart) {
        chart.dispose();
        chart = null;
      }
      chart = window.echarts.init(root, t.dark ? 'dark' : null, { renderer: 'svg' });
      chart.setOption(opt, true);          /* notMerge: no stale series */
    } catch (e) {
      report(0, false, 'echarts: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    hasRendered = true;
    /* Two frames: the first lets the svg renderer lay out, the second lets it
       paint, so the measured box is final. The container height is
       authoritative here — if the measured box comes back empty the chart
       would still be non-zero, and reporting 0 would leave a blank block. */
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        report(measure() || h, true, '');
      });
    });
  }

  /* --- entry points ---------------------------------------------------- */

  window.render = function (json) {
    pendingPayload = json;
    armWatchdog();
    if (!libReady) {
      return;                  /* replayed by window.__libReady() */
    }
    renderPayload(pendingPayload);
  };

  window.__libReady = function () {
    libReady = true;
    if (pendingPayload !== null) {
      renderPayload(pendingPayload);
    }
  };

  window.__libFail = function (what) {
    libReady = true;
    report(0, false, String(what) + ' failed to load');
  };

  /* A width change re-lays out the chart; the height (and therefore the
     reported value) may only change when the svg reflows. */
  watchResize(function () {
    if (!hasRendered) {
      return;
    }
    if (chart) {
      try {
        chart.resize();
      } catch (e) {
        /* resizing is best effort */
      }
    }
    reportFromResize();
  });
})();
</script>
<script src="vendor/echarts.min.js"
        onload="window.__libReady()"
        onerror="window.__libFail('vendor/echarts.min.js')"></script>
</body>
</html>
